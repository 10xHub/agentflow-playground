<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10xGraph Playground</title>
    <meta name="description" content="10xGraph Playground: chat with, inspect and debug your 10xGraph agents." />
    <meta name="theme-color" content="#0b0e13" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // Mirrors lib/use-theme.js (key "10xgraph.theme", default dark). Falls back to the
      // pre-rename "agentflow.theme" key, which lib/storage-migration.js moves on load.
      (function () {
        try {
          var m =
            localStorage.getItem("10xgraph.theme") || localStorage.getItem("agentflow.theme")
          if (["light", "dark", "system"].indexOf(m) === -1) m = "dark"
          var dark =
            m === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
              : m === "dark"
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light")
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
